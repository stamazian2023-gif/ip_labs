<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Flexbox Example</title>
<style>

.container {
display: flex;
flex-direction: row; 
flex-wrap: wrap; 
justify-content: space-between; 
align-items: center; 
align-content: stretch; 
height: 300px; 
background-color: lightgray;
}

.item {
flex-grow: 1;
flex-shrink: 1; 
flex-basis: 150px; 
background-color: lightblue;
margin: 10px;
padding: 20px;
text-align: center;
}


.item:nth-child(2) {
align-self: flex-end; 
order: -1; 
}
</style>
</head>
<body>

<div class="container">
<div class="item">Елемент 1</div>
<div class="item">Елемент 2</div>
<div class="item">Елемент 3</div>
<div class="item">Елемент 4</div>
</div>

</body>
</html>
